[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askmodel"
version = "0.2.0"
description = "AI-assisted project development CLI"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "filelock>=3.13",
    "colorama>=0.4.6"
]

[project.scripts]
askmodel = "askmodel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]